services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: repogpt-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongo
      - REDIS_HOST=redis
      - CHROMA_HOST=chroma
      - DATA_DIR=/data
      - MODEL_CACHE_DIR=/models
    volumes:
      - repo_data:/data
      - model_cache:/models
    ports:
      - "8000:8000"
    networks:
      - edge
      - data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: repogpt-worker:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "-B", "-Q", "ingest,eval,review", "--concurrency", "2"]
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongo
      - REDIS_HOST=redis
      - CHROMA_HOST=chroma
      - DATA_DIR=/data
      - MODEL_CACHE_DIR=/models
    volumes:
      - repo_data:/data
      - model_cache:/models
    networks:
      - edge
      - data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGODB_DB: ${MONGODB_DB:-repogpt}
      MONGO_APP_USER: ${MONGO_APP_USER:-repogpt}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru;
      else
        redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG;
        else
          redis-cli ping | grep -q PONG;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chroma:
    image: chromadb/chroma:0.5.15
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - data

  # Profile: local-llm (§16.2)
  ollama:
    image: ollama/ollama:0.5.4
    profiles:
      - local-llm
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - data
    ports:
      - "127.0.0.1:11434:11434"

  # Profile: monitoring (§16.2, §18)
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
    restart: unless-stopped
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo_data:
  redis_data:
  chroma_data:
  repo_data:
  model_cache:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  edge:
  data:
    internal: true
