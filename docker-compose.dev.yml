services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - repo_data:/data
      - model_cache:/models
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    volumes:
      - ./backend/app:/app/app
      - repo_data:/data
      - model_cache:/models

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - edge
    depends_on:
      - api

  mongo:
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  chroma:
    ports:
      - "127.0.0.1:8001:8000"
