services:
  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    image: ghcr.io/repogpt/caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  api:
    image: ghcr.io/repogpt/api:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  worker:
    image: ghcr.io/repogpt/api:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M

volumes:
  caddy_data:
  caddy_config:
