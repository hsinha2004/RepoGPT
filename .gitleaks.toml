title = "RepoGPT Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for fixture directories and tests"
paths = [
  '''eval/fixtures/''',
  '''tests/unit/test_redaction.py''',
  '''backend/tests/unit/test_security_primitives.py''',
  '''\.github/workflows/ci\.yml$''',
  '''\.env\.example$'''
]
