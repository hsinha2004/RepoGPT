name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  security:
    name: Security Vulnerability & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Bandit Static Security Scanner
        run: |
          pip install bandit
          bandit -r backend/app -ll -ii

      - name: Run pip-audit Dependency Vulnerability Scanner
        run: |
          pip install pip-audit uv
          uv pip compile backend/pyproject.toml -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --ignore-vuln CVE-2024-99999 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NPM Security Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Build Docker API Image for Scan
        run: |
          docker build -t repogpt-api:scan -f backend/Dockerfile ./backend

      - name: Run Trivy Vulnerability Scanner on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "repogpt-api:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
