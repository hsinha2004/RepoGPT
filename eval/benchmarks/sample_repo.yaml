name: taskflow-sample
description: Ground-truth questions for the TaskFlow fixture repository
repo:
  type: fixture
  path: eval/fixtures/sample-repo
questions:
  - id: q01
    question: Where is the JWT access token created?
    category: locate
    expected_intent: locate
    expected_files:
      - backend/app/auth/security.py
    expected_symbols:
      - create_access_token
    must_mention:
      - create_access_token
      - expire
    reference_answer: JWT access tokens are created in backend/app/auth/security.py using the create_access_token function with a configurable expiration time.

  - id: q02
    question: Where is the password verification function implemented?
    category: locate
    expected_intent: locate
    expected_files:
      - backend/app/auth/security.py
    expected_symbols:
      - verify_password
    must_mention:
      - verify_password
    reference_answer: Password verification is implemented in backend/app/auth/security.py using verify_password.

