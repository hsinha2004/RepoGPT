  - id: q27
    question: How does a request to create a task flow from React to the database?
    category: flow
    expected_intent: flow
    expected_files:
      - frontend/src/pages/TasksPage.tsx
      - backend/app/tasks/routes.py
      - backend/app/tasks/service.py
      - backend/app/tasks/repository.py
    expected_symbols:
      - TasksPage
      - create_task
    must_mention:
      - TasksPage
      - TaskService
      - TaskRepository
    reference_answer: TasksPage sends an HTTP POST request to /tasks, handled by backend/app/tasks/routes.py, which calls TaskService.create_task and TaskRepository.create.

