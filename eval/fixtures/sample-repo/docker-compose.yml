version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/taskflow.db
      - SECRET_KEY=taskflow-development-secret-key-32chars
    volumes:
      - taskflow-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  reminder-worker:
    build:
      context: ./services/reminder-worker
      dockerfile: Dockerfile
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  taskflow-data:
